# Example Telegraf scalar topics. Free RAM = Linux MemAvailable. Customize broker, nodes, NICs and mounts.
broker:
  host: mqtt.example.com
  port: 1883
  tls: false
  username_env: TURZX_MQTT_USER
  password_env: TURZX_MQTT_PASSWORD
render:
  batch_frames: true
sensors:
  MqttNode1Cpu:
    label: node1 · cpu/cpu-total/usage_active
    topic: example/cluster/node1/cpu/cpu-total/usage_active
    kind: number
    unit: '%'
    decimals: 1
    stale_after: 60
    history: 60
  MqttNode1RamPercent:
    label: node1 · mem/used_percent
    topic: example/cluster/node1/mem/used_percent
    kind: number
    unit: '%'
    decimals: 1
    stale_after: 60
    history: 60
  MqttNode1RamUsed:
    label: node1 · mem/used
    topic: example/cluster/node1/mem/used
    kind: number
    unit: ' GiB used'
    decimals: 1
    stale_after: 60
    history: 60
    scale: 9.313225746154785e-10
  MqttNode1RamFree:
    label: node1 · mem/available
    topic: example/cluster/node1/mem/available
    kind: number
    unit: ' GiB free'
    decimals: 1
    stale_after: 60
    history: 60
    scale: 9.313225746154785e-10
  MqttNode1Root:
    label: node1 · disk/_/used_percent
    topic: example/cluster/node1/disk/_/used_percent
    kind: number
    unit: '%'
    decimals: 1
    stale_after: 60
    history: 60
  MqttNode2Cpu:
